<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CR Anti Maker — Seeok</title>
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E" />
</head>
<body>
<header class="topbar">
  <h1>CR Anti Maker</h1>
  <div class="counter" id="counter">0 kart için anti seçildi</div>
</header>

<main>
  <section class="panel">
    <h2>1. Rakibin kartını seç</h2>
    <p class="hint">Bir kart seç, altta o karta karşı kullandığın anti'leri işaretle. Sonra başka bir karta geç.</p>
    <div class="grid" id="wc-grid"></div>
  </section>

  <section class="panel" id="anti-panel" hidden>
    <h2>2. <span id="anti-title">—</span> için anti seç</h2>
    <p class="hint">Birden fazla seçebilirsin. Tekrar tıklayarak kaldırabilirsin.</p>
    <input type="search" id="search" placeholder="Kart ara…" autocomplete="off" />
    <div class="grid grid-sm" id="all-grid"></div>

    <div class="edit-drawer" id="edit-drawer" hidden>
      <div class="ed-header">
        <span class="ed-title">Düzenleniyor: <strong id="ed-card-name">—</strong></span>
        <button class="ed-close" id="ed-close" type="button" aria-label="Kapat">×</button>
      </div>
      <label class="ed-row">
        <span class="ed-label">Not</span>
        <input type="text" id="ed-note" placeholder="örn: yan kartlara bağlı, sayaç değişir…" maxlength="120" />
      </label>
      <div class="ed-row">
        <span class="ed-label">Rakipte yoksa</span>
        <div class="ed-cond" data-mode="absent">
          <div class="ed-chips" id="ed-chips-absent"></div>
          <input type="search" class="ed-cond-search" data-mode="absent" placeholder="Kart ekle…" autocomplete="off" />
          <div class="ed-suggest" data-mode="absent" hidden></div>
        </div>
      </div>
      <div class="ed-row">
        <span class="ed-label">Rakipte varsa</span>
        <div class="ed-cond" data-mode="present">
          <div class="ed-chips" id="ed-chips-present"></div>
          <input type="search" class="ed-cond-search" data-mode="present" placeholder="Kart ekle…" autocomplete="off" />
          <div class="ed-suggest" data-mode="present" hidden></div>
        </div>
      </div>
    </div>
  </section>

  <section class="panel" id="summary-panel" hidden>
    <h2>3. Özet</h2>
    <div id="summary"></div>
    <div class="actions">
      <button id="copy-btn" class="primary">Kopyala</button>
      <button id="reset-btn" class="ghost">Sıfırla</button>
    </div>
    <textarea id="output" readonly></textarea>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
